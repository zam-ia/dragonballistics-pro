name: Format Phase 3D Corrections
on:
  push:
    branches:
      - feature/inverse-solver
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/inverse-solver
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/src/features/workbench/InverseSolverPanel.tsx apps/web/src/features/workbench/inverse-solver-model.ts apps/web/src/features/workbench/inverse-solver.test.ts apps/web/src/workers/solver-protocol.ts
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add apps/web/src/features/workbench/InverseSolverPanel.tsx apps/web/src/features/workbench/inverse-solver-model.ts apps/web/src/features/workbench/inverse-solver.test.ts apps/web/src/workers/solver-protocol.ts
            git commit -m 'style(ui): format extracted logic and validation'
            git push origin HEAD:feature/inverse-solver
          fi
