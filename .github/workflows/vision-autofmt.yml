name: Vision one-time formatting

on:
  push:
    branches:
      - feature/vision-analysis
    paths:
      - .github/workflows/vision-autofmt.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/src/features/vision/vision.worker.ts apps/web/src/pages/VisionPage.tsx
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/features/vision/vision.worker.ts apps/web/src/pages/VisionPage.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(vision): format vision source files"
            git push origin HEAD:feature/vision-analysis
          fi
