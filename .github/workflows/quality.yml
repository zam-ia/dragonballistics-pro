name: Quality

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Preserve desktop and mobile visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solver-3d-responsive-screenshots
          path: test-results/visuals/*.png
          if-no-files-found: ignore
      - run: pnpm benchmark:solver
