name: Format mobile solver test
on:
  push:
    branches: [feature/inverse-solver]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/inverse-solver
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write tests/end-to-end/inverse-solver-ui.spec.ts
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add tests/end-to-end/inverse-solver-ui.spec.ts
            git commit -m 'style(test): format mobile spacing assertion'
            git push origin HEAD:feature/inverse-solver
          fi
